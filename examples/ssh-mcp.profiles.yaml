# Example ssh-mcp profile catalog.
# Copy this file, then replace hosts and ${ENV_VAR} placeholders.
# Do not commit real IPs, hostnames, passwords, or private keys.
version: 1
activeProfile: fi-template

defaults:
  timeout: 120000
  maxChars: none
  disableSudo: false

# Directory buckets for profiles-list / profiles-find.
# Removing a bucket does not delete machines.
buckets:
  - id: template
    name: 模板机
    aliases: [template, 模板]
  - id: relay
    name: 中转
    aliases: [relay, 中转]

profiles:
  - id: fi-template
    name: 芬兰模板机
    aliases: [Finland template]
    host: "fi-template.example.com"
    port: 9900
    user: root
    auth:
      type: password
      password: "${SSH_TEMPLATE_PASSWORD}"
    # Optional: sudo-exec uses this with sudo -S. Omit to fall back to sudo -n.
    sudoPassword: "${SSH_TEMPLATE_SUDO_PASSWORD}"
    # Optional: if set, every exec is already elevated via su -c.
    # suPassword: "${SSH_TEMPLATE_SU_PASSWORD}"
    note: "模板维护机，做 cloud-init 和预装验证"
    tags: [template, fi]

  - id: jp-relay
    name: 日本中转
    aliases: [Japan relay]
    host: "jp-relay.example.com"
    port: 22
    user: root
    auth:
      type: key
      keyPath: "${SSH_HETZNER_KEY_PATH}"
    note: "日本入口机，主要做转发与链路排障"
    tags: [relay, jp]
